name: Linux community packages

# Community (fork-side) packaging lane: builds .deb / .rpm / .flatpak from
# upstream stable tags (nexu-io/open-design) with our patch series applied via
# cherry-pick, then publishes them as a "<tag>-linux" release on this fork.
# This workflow is independent of the upstream ci.yml / capability-workflow
# topology and does not produce PR handoff artifacts.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to package (e.g. open-design-v0.25.0); empty = latest open-design-v* tag"
        required: false
        default: ""
        type: string
  schedule:
    # Daily latest-tag check. Off-round minute on purpose (avoid :00 load spike).
    - cron: '41 3 * * *'

permissions:
  contents: write

concurrency:
  group: linux-packages
  cancel-in-progress: false

env:
  # Branch carrying our patch series (cherry-pick SOURCE). When the series is
  # re-cut onto a branch with a different name, update this value in the same
  # change as packaging/linux/SERIES-BASE — see docs/linux-packages.md.
  SERIES_BRANCH: linux-packages-0.24.1

jobs:
  detect:
    name: Detect upstream tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      new: ${{ steps.resolve.outputs.new }}
    steps:
      - name: Resolve target tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            # Highest upstream tag by version; drop peeled "^{}" lines from
            # annotated tags and strip the refs/tags/ prefix.
            TAG="$(git ls-remote --tags --sort=-v:refname https://github.com/nexu-io/open-design 'open-design-v*' \
              | cut -f2 \
              | grep -v '\^{}$' \
              | sed -n '1p' \
              | sed 's|^refs/tags/||')"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::No upstream tag resolved (empty ls-remote result or empty input)"
            exit 1
          fi
          # The release job creates "<tag>-linux", so the skip gate must look
          # for that exact release name, not the raw upstream tag.
          NEW=true
          if gh release view "${TAG}-linux" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            NEW=false
          fi
          echo "Resolved tag: $TAG (new release needed: $NEW)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

  build:
    name: Build deb and rpm
    needs: detect
    if: needs.detect.outputs.new == 'true'
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is required: the cherry-pick range
      # "<SERIES-BASE>..<SERIES_BRANCH>" needs the base commit object, which
      # lives in our branch's history (the series was cut from it).
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm via corepack
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: corepack enable
        # packageManager in package.json pins pnpm 10.33.2; do not install pnpm manually.

      - name: Apply patch series onto upstream tag
        env:
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "linux-packages bot"
          git config user.email "linux-packages-bot@users.noreply.github.com"
          git remote add upstream https://github.com/nexu-io/open-design.git
          git fetch --depth 1 upstream "refs/tags/${TAG}:refs/tags/${TAG}"
          # SERIES-BASE carries one comment line; strip it for the range.
          BASE="$(grep -v '^#' packaging/linux/SERIES-BASE | sed -n '1p')"
          echo "Patch series range: ${BASE}..origin/${SERIES_BRANCH}"
          git checkout -B linux-build "refs/tags/${TAG}"
          if ! git cherry-pick "${BASE}..origin/${SERIES_BRANCH}"; then
            git cherry-pick --abort
            echo "::error::Cherry-pick of ${BASE}..origin/${SERIES_BRANCH} onto ${TAG} failed — upstream rewrote a patched area. Rebase the series manually (docs/linux-packages.md) and update packaging/linux/SERIES-BASE."
            exit 1
          fi
          git log --oneline -10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runners have ~14 GB free; each package artifact is ~2 GB. Sequential
      # single-runner builds fit. If disk ever gets tight, the pnpm store under
      # node_modules/.pnpm (after install) is the first candidate to prune —
      # measure here before changing anything.
      - name: Disk checkpoint
        run: df -h .

      - name: Build .deb
        run: |
          set -euo pipefail
          pnpm tools-pack linux build --to deb
          mkdir -p output
          # electron-builder wipes its output root on every run (the rpm build
          # would remove the deb), so copy each artifact aside right after its
          # build finishes.
          find .tmp -name '*.deb' -exec cp -v {} output/ \;
          ls -lh output/

      - name: Build .rpm
        run: |
          set -euo pipefail
          pnpm tools-pack linux build --to rpm
          find .tmp -name '*.rpm' -exec cp -v {} output/ \;
          ls -lh output/

      - name: Upload deb and rpm
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages-deb-rpm
          path: output/*
          if-no-files-found: error

  flatpak:
    name: Build Flatpak bundle
    needs: detect
    if: needs.detect.outputs.new == 'true'
    # Best-effort lane: a flatpak failure must not block deb/rpm or the release.
    continue-on-error: true
    runs-on: ubuntu-latest
    # v1 duplicates the checkout/prep/pnpm block from the build job for
    # simplicity; extracting a composite action is the known follow-up.
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm via corepack
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: corepack enable

      - name: Apply patch series onto upstream tag
        env:
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "linux-packages bot"
          git config user.email "linux-packages-bot@users.noreply.github.com"
          git remote add upstream https://github.com/nexu-io/open-design.git
          git fetch --depth 1 upstream "refs/tags/${TAG}:refs/tags/${TAG}"
          BASE="$(grep -v '^#' packaging/linux/SERIES-BASE | sed -n '1p')"
          echo "Patch series range: ${BASE}..origin/${SERIES_BRANCH}"
          git checkout -B linux-build "refs/tags/${TAG}"
          if ! git cherry-pick "${BASE}..origin/${SERIES_BRANCH}"; then
            git cherry-pick --abort
            echo "::error::Cherry-pick of ${BASE}..origin/${SERIES_BRANCH} onto ${TAG} failed — upstream rewrote a patched area. Rebase the series manually (docs/linux-packages.md) and update packaging/linux/SERIES-BASE."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install flatpak tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # Runtime trio matching packaging/flatpak/io.open-design.desktop.json (26.08).
          flatpak install --user -y flathub \
            org.freedesktop.Platform//26.08 \
            org.freedesktop.Sdk//26.08 \
            org.electronjs.Electron2.BaseApp//26.08

      # --jobs=1 is deliberate: flatpak-builder is memory-hungry and the lane
      # shares the runner with nothing else; keep RAM usage bounded.
      - name: Build unpacked runtime
        run: pnpm tools-pack linux build --to dir

      - name: Build Flatpak bundle
        run: |
          set -euo pipefail
          mkdir -p output
          # Manifest source paths resolve relative to packaging/flatpak/, so
          # run from the repo root. App id comes from the manifest ("id" field).
          flatpak-builder --force-clean --jobs=1 builddir packaging/flatpak/io.open-design.desktop.json
          flatpak build-bundle --runtime builddir output/open-design.flatpak io.opendesign.desktop
          ls -lh output/

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: linux-flatpak
          path: output/*
          if-no-files-found: error

  release:
    name: Publish Linux release
    needs: [build, flatpak]
    if: needs.detect.outputs.new == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.detect.outputs.tag }}
    steps:
      # Shallow checkout: the release notes read packaging/linux/SERIES-BASE
      # so they follow SERIES-BASE/SERIES_BRANCH on a re-cut instead of going stale.
      - uses: actions/checkout@v6

      - name: Download deb and rpm
        uses: actions/download-artifact@v4
        with:
          name: linux-packages-deb-rpm
          path: output

      # The flatpak lane is best-effort; a missing artifact must not fail the
      # release. The step-level continue-on-error swallows the download error.
      - name: Download Flatpak bundle
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: linux-flatpak
          path: output-flatpak

      - name: Merge flatpak bundle into output
        run: |
          set -euo pipefail
          if [ -d output-flatpak ] && compgen -G 'output-flatpak/*' >/dev/null; then
            mv -v output-flatpak/* output/
          else
            echo "No Flatpak bundle to publish (flatpak lane is best-effort)."
          fi
          ls -lh output/

      - name: Create release
        run: |
          set -euo pipefail
          if gh release view "${TAG}-linux" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${TAG}-linux already exists — skipping creation."
            exit 0
          fi
          BASE="$(grep -v '^#' packaging/linux/SERIES-BASE | sed -n '1p')"
          {
            echo "Community Linux packages for upstream ${TAG}."
            echo
            # Series branch/base are parameterized so a re-cut (SERIES-BASE +
            # SERIES_BRANCH update) refreshes the notes without edits here.
            echo "**Patch series:** branch \`${SERIES_BRANCH}\`, cut from upstream tag \`${BASE}\`, applied via cherry-pick."
            echo
            cat <<'NOTES'
          ### Applied on top of the upstream tag

          - Native module install policy and validation (upstream PR #7979)
          - Standards-compliant `.deb` target (based on upstream PR #6010)
          - `.deb` dependency set: `libgbm1`, `libasound2`
          - `.rpm` target via fpm, with an fpm license passthrough fix
          - Flatpak manifest and launcher (`packaging/flatpak/io.open-design.desktop.json`)
          - Web standalone runtime shipped inside Linux packages

          ### Install

          ```bash
          # Debian / Ubuntu
          sudo apt install ./open-design_*_amd64.deb

          # Fedora / RHEL
          sudo dnf install ./open-design-*.rpm

          # Flatpak (single-file bundle)
          flatpak --user install ./open-design.flatpak
          ```

          ### Caveats

          - These packages are **unsigned**; verify the checksums before installing.
          - Flatpak: Chromium's inner sandbox is disabled (`ELECTRON_DISABLE_SANDBOX=1`); the Flatpak sandbox itself remains the security boundary.
          - deb/rpm installs live under `/opt`.
          - No auto-update in these community packages; install a newer release to upgrade.
          NOTES
          } > release-notes.md
          gh release create "${TAG}-linux" output/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "OpenDesign Linux — ${TAG}" \
            --notes-file release-notes.md
